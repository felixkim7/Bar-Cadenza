[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "bar-cadenza"
version = "0.0.0"
description = "Bar Cadenza development scaffold; gameplay not implemented"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pygame-ce>=2.5,<3",
  "pydantic>=2.8,<3",
  "platformdirs>=4,<5",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
